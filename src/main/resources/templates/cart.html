<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cart - Beautifer</title>
    <link rel="icon" type="image/jpeg" href="/images/beautifer-logo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f1923; font-family: 'Poppins', sans-serif; color: #fff; min-height: 100vh; }

        /* Navbar */
        .navbar { background: linear-gradient(90deg, #0f2027, #203a43); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px 0; }
        .brand-name { font-family: 'Great Vibes', cursive; font-size: 2rem; color: #17a2b8; text-decoration: none; }
        .heel-icon { color: #e91e8c; font-size: 1.2rem; }
        .nav-btn { border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.8); font-size: 0.82rem; border-radius: 20px; padding: 6px 16px; background: transparent; text-decoration: none; transition: all 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: #17a2b8; }
        .btn-logout { background: #c0392b; border: none; color: #fff; font-size: 0.82rem; border-radius: 20px; padding: 6px 16px; text-decoration: none; }
        .btn-logout:hover { opacity: 0.85; color: #fff; }

        /* Page */
        .page-header { padding: 28px 0 20px; }
        .section-title { font-size: 1.2rem; font-weight: 600; color: #fff; }

        /* Cart table */
        .cart-table-wrap {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }

        thead tr { background: rgba(23,162,184,0.08); border-bottom: 1px solid rgba(255,255,255,0.07); }
        thead th { color: #a0d8d8; font-size: 0.75rem; font-weight: 600; letter-spacing: 1.5px; padding: 14px 20px; text-align: left; }

        tbody tr { border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(255,255,255,0.03); }
        tbody td { padding: 16px 20px; color: #fff; font-size: 0.88rem; vertical-align: middle; }

        .product-cell { font-weight: 500; }
        .price-cell { color: rgba(255,255,255,0.7); }
        .qty-cell { color: rgba(255,255,255,0.7); }
        .subtotal-cell { color: #17a2b8; font-weight: 600; }

        .btn-remove {
            background: rgba(231,76,60,0.12);
            border: 1px solid rgba(231,76,60,0.25);
            color: #e74c3c;
            border-radius: 8px;
            padding: 5px 14px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        .btn-remove:hover { background: rgba(231,76,60,0.25); border-color: #e74c3c; }

        /* Order summary box */
        .summary-box {
            background: rgba(23,162,184,0.07);
            border: 1px solid rgba(23,162,184,0.18);
            border-radius: 16px;
            padding: 1.8rem;
        }
        .summary-label { color: rgba(255,255,255,0.45); font-size: 0.75rem; letter-spacing: 1.5px; margin-bottom: 6px; }
        .summary-total { color: #17a2b8; font-size: 2rem; font-weight: 700; margin-bottom: 1.2rem; }
        .btn-order {
            background: linear-gradient(90deg, #17a2b8, #0d6efd);
            border: none;
            border-radius: 12px;
            padding: 13px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        .btn-order:hover { opacity: 0.88; transform: translateY(-1px); }

        .continue-link { color: rgba(255,255,255,0.4); font-size: 0.82rem; text-align: center; display: block; margin-top: 12px; text-decoration: none; }
        .continue-link:hover { color: #17a2b8; }

        /* Empty cart */
        .empty-cart { text-align: center; padding: 90px 0; color: rgba(255,255,255,0.35); }
        .empty-cart h4 { font-size: 1.1rem; margin: 12px 0 6px; }
        .btn-shop { background: linear-gradient(90deg, #17a2b8, #0d6efd); border: none; border-radius: 10px; padding: 10px 28px; color: #fff; font-size: 0.88rem; font-weight: 600; text-decoration: none; display: inline-block; margin-top: 16px; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container d-flex align-items-center gap-3">
        <a href="/products" class="brand-name">Beautifer <span class="heel-icon">👠</span></a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a href="/products" class="nav-btn">← Shop</a>
            <a href="/profile" class="nav-btn">👤 Profile</a>
            <a href="/order/history" class="nav-btn">📦 Orders</a>
            <a href="/logout" class="btn-logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h5 class="section-title">🛒 Your Cart</h5>
    </div>

    <!-- Empty cart -->
    <div th:if="${#lists.isEmpty(cartItems)}" class="empty-cart">
        <div style="font-size:3rem;">🛍️</div>
        <h4>Your cart is empty</h4>
        <p>Looks like you haven't added anything yet</p>
        <a href="/products" class="btn-shop">Start Shopping</a>
    </div>

    <!-- Cart content -->
    <div th:if="${!#lists.isEmpty(cartItems)}">
        <div class="row g-4">

            <!-- Cart table -->
            <div class="col-lg-8">
                <div class="cart-table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>PRODUCT</th>
                                <th>PRICE</th>
                                <th>QTY</th>
                                <th>SUBTOTAL</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td class="product-cell" th:text="${item.product.name}"></td>
                                <td class="price-cell">₹<span th:text="${#numbers.formatDecimal(item.product.price, 1, 'COMMA', 2, 'POINT')}"></span></td>
                                <td class="qty-cell" th:text="${item.quantity}"></td>
                                <td class="subtotal-cell">₹<span th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 1, 'COMMA', 2, 'POINT')}"></span></td>
                                <td>
                                    <form action="/cart/remove" method="post">
                                        <input type="hidden" name="cartId" th:value="${item.id}">
                                        <button type="submit" class="btn-remove">Remove</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Order summary -->
            <div class="col-lg-4">
                <div class="summary-box">
                    <p class="summary-label">ORDER TOTAL</p>
                    <p class="summary-total">₹<span th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></span></p>
                    <form action="/order/place" method="post">
                        <button type="submit" class="btn-order">Place Order →</button>
                    </form>
                    <a href="/products" class="continue-link">← Continue Shopping</a>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shop - Beautifer</title>
    <link rel="icon" type="image/jpeg" href="/images/beautifer-logo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f1923; font-family: 'Poppins', sans-serif; color: #fff; min-height: 100vh; }

        /* Navbar */
        .navbar { background: linear-gradient(90deg, #0f2027, #203a43); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px 0; }
        .brand-name { font-family: 'Great Vibes', cursive; font-size: 2rem; color: #17a2b8; text-decoration: none; }
        .heel-icon { color: #e91e8c; font-size: 1.2rem; }
        .nav-btn { border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.8); font-size: 0.82rem; border-radius: 20px; padding: 6px 16px; background: transparent; text-decoration: none; transition: all 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: #17a2b8; }
        .btn-logout { background: #c0392b; border: none; color: #fff; font-size: 0.82rem; border-radius: 20px; padding: 6px 16px; text-decoration: none; transition: opacity 0.2s; }
        .btn-logout:hover { opacity: 0.85; color: #fff; }

        /* Search */
        .search-input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 25px; padding: 9px 20px; width: 280px; font-family: 'Poppins', sans-serif; font-size: 0.85rem; outline: none; transition: all 0.2s; }
        .search-input:focus { border-color: #17a2b8; box-shadow: 0 0 0 3px rgba(23,162,184,0.2); background: rgba(255,255,255,0.11); }
        .search-input::placeholder { color: rgba(255,255,255,0.35); }
        .btn-search { background: linear-gradient(90deg, #17a2b8, #0d6efd); border: none; border-radius: 25px; padding: 9px 22px; color: #fff; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-search:hover { opacity: 0.88; }

        /* Page header */
        .page-header { padding: 28px 0 16px; }
        .section-title { font-size: 1.2rem; font-weight: 600; color: #fff; margin-bottom: 2px; }
        .welcome-text { color: #a0d8d8; font-size: 0.82rem; }

        /* Product cards */
        .product-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .product-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.4); border-color: rgba(23,162,184,0.35); }

        .product-img-wrap { width: 100%; height: 200px; overflow: hidden; background: #1a2a3a; }
        .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
        .product-card:hover .product-img-wrap img { transform: scale(1.05); }

        .card-body { padding: 1rem 1.1rem 1.2rem; display: flex; flex-direction: column; flex: 1; }
        .product-name { font-weight: 600; font-size: 0.92rem; color: #fff; margin-bottom: 5px; line-height: 1.3; }
        .product-desc { color: rgba(255,255,255,0.42); font-size: 0.78rem; line-height: 1.4; flex: 1; margin-bottom: 10px; }
        .product-price { color: #17a2b8; font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; }
        .stock-ok { color: rgba(255,255,255,0.35); font-size: 0.75rem; margin-bottom: 12px; }
        .stock-out { color: #e74c3c; font-size: 0.75rem; margin-bottom: 12px; }

        .btn-cart {
            background: linear-gradient(90deg, #17a2b8, #0d6efd);
            border: none;
            border-radius: 9px;
            color: #fff;
            padding: 9px;
            font-size: 0.84rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-cart:hover { opacity: 0.85; }
        .btn-cart:disabled { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); cursor: not-allowed; }

        /* Empty / no results */
        .no-results { text-align: center; padding: 80px 0; color: rgba(255,255,255,0.35); }
        .no-results h4 { font-size: 1.1rem; margin-bottom: 8px; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container d-flex align-items-center gap-3">
        <a href="/products" class="brand-name">Beautifer <span class="heel-icon">👠</span></a>

        <form action="/products" method="get" class="d-flex align-items-center gap-2 mx-auto">
            <input type="text" name="search" class="search-input"
                   placeholder="🔍  Search products..." th:value="${search}">
            <button type="submit" class="btn-search">Search</button>
        </form>

        <div class="d-flex align-items-center gap-2">
            <a href="/cart" class="nav-btn">🛒 Cart</a>
            <a href="/profile" class="nav-btn">👤 Profile</a>
            <a href="/order/history" class="nav-btn">📦 Orders</a>
            <a href="/logout" class="btn-logout">Logout</a>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container">
    <div class="page-header">
        <h5 class="section-title">
            <span th:if="${search == null or search.isEmpty()}">All Products</span>
            <span th:if="${search != null and !search.isEmpty()}">Results for "<span th:text="${search}"></span>"</span>
        </h5>
        <p class="welcome-text">Welcome back, <span th:text="${user.name}"></span>!</p>
    </div>

    <!-- No results -->
    <div th:if="${#lists.isEmpty(products)}" class="no-results">
        <h4>😕 No products found</h4>
        <p>Try a different keyword</p>
        <a href="/products" style="color:#17a2b8; font-size:0.9rem;">View all products</a>
    </div>

    <!-- Products grid -->
    <div class="row g-4">
        <div th:each="product : ${products}" class="col-lg-3 col-md-4 col-sm-6">
            <div class="product-card">
                <div class="product-img-wrap">
                    <img th:src="${product.imageUrl}"
                         th:alt="${product.name}"
                         onerror="this.src='https://placehold.co/400x200/1a2a3a/17a2b8?text=Beautifer'">
                </div>
                <div class="card-body">
                    <p class="product-name" th:text="${product.name}"></p>
                    <p class="product-desc" th:text="${product.description}"></p>
                    <p class="product-price">₹<span th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}"></span></p>
                    <p th:if="${product.stock > 0}" class="stock-ok">✓ In Stock (<span th:text="${product.stock}"></span> left)</p>
                    <p th:if="${product.stock == 0}" class="stock-out">✗ Out of Stock</p>
                    <form action="/cart/add" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <input type="hidden" name="quantity" value="1">
                        <button type="submit" class="btn-cart" th:disabled="${product.stock == 0}">
                            + Add to Cart
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Beautifer</title>
    <link rel="icon" type="image/jpeg" href="/images/beautifer-logo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }

        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .brand-name {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #17a2b8;
            line-height: 1;
        }

        .heel-icon {
            color: #e91e8c;
            font-size: 1.8rem;
            margin-left: 4px;
            vertical-align: middle;
        }

        .page-title {
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 1rem;
        }

        .form-control:focus {
            border-color: #17a2b8;
            box-shadow: 0 0 0 3px rgba(23,162,184,0.2);
            background: rgba(255,255,255,0.11);
        }

        .form-control::placeholder { color: rgba(255,255,255,0.3); }

        .btn-brand {
            background: linear-gradient(90deg, #17a2b8, #0d6efd);
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            margin-top: 0.5rem;
            transition: opacity 0.2s, transform 0.2s;
        }

        .btn-brand:hover { opacity: 0.9; transform: translateY(-1px); }

        .divider { border-color: rgba(255,255,255,0.1); margin: 1.5rem 0; }

        .signin-text {
            color: rgba(255,255,255,0.5);
            font-size: 0.88rem;
            text-align: center;
        }

        .signin-text a { color: #17a2b8; text-decoration: none; }
        .signin-text a:hover { text-decoration: underline; }

        .alert-danger {
            background: rgba(220,53,69,0.15);
            border: 1px solid rgba(220,53,69,0.3);
            color: #ff6b7a;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div>
            <span class="brand-name">Beautifer</span>
            <span class="heel-icon">👠</span>
        </div>

        <p class="page-title">Sign in to your account</p>

        <div th:if="${error}" class="alert-danger" th:text="${error}"></div>

        <form action="/login" method="post">
            <label class="form-label">EMAIL ADDRESS</label>
            <input type="email" name="email" class="form-control"
                   placeholder="Enter your email" required>
            <button type="submit" class="btn-brand">Send OTP →</button>
        </form>

        <hr class="divider">
        <p class="signin-text">New to Beautifer? <a href="/register">Create account</a></p>
    </div>
</body>
</html>

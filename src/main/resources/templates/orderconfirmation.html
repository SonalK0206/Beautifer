<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Confirmed - Beautifer</title>
    <link rel="icon" type="image/jpeg" href="/images/beautifer-logo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { background: #0f1923; font-family: 'Poppins', sans-serif; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: linear-gradient(90deg, #0f2027, #203a43) !important; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .navbar-brand img { width: 100px; border-radius: 8px; }
        .confirm-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(23,162,184,0.2); border-radius: 20px; padding: 3rem; text-align: center; }
        .check-circle { width: 80px; height: 80px; background: linear-gradient(135deg, #17a2b8, #0d6efd); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.5rem; }
        .order-id { color: #17a2b8; font-weight: 700; font-size: 1.1rem; }
        .order-amount { font-size: 2rem; font-weight: 700; color: #fff; }
        .status-badge { background: rgba(23,162,184,0.15); border: 1px solid #17a2b8; color: #17a2b8; border-radius: 20px; padding: 4px 16px; font-size: 0.85rem; }
        .btn-shop { background: linear-gradient(90deg, #17a2b8, #0d6efd); border: none; border-radius: 10px; padding: 10px 24px; color: #fff; font-weight: 600; }
        .btn-orders { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 10px 24px; color: #fff; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/products">
            <div class="text-center mb-3">
                <span style="font-family: 'Great Vibes', cursive; font-size: 3rem; color: #17a2b8;">Beautifer</span>
                <span style="font-size: 1.5rem;">👠</span>
            </div>
        </a>
        <div class="ms-auto"><a href="/logout" class="btn btn-danger btn-sm rounded-pill px-3">Logout</a></div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="confirm-card">
                <div class="check-circle">✓</div>
                <h3 class="mb-1">Order Confirmed!</h3>
                <p class="text-white-50">Thank you, <span th:text="${user.name}"></span>!</p>
                <p class="order-id mt-3">Order #<span th:text="${order.id}"></span></p>
                <p class="order-amount">₹<span th:text="${order.totalAmount}"></span></p>
                <span class="status-badge" th:text="${order.status}"></span>
                <div class="d-flex gap-3 justify-content-center mt-4">
                    <a href="/products" class="btn-shop">Continue Shopping</a>
                    <a href="/order/history" class="btn-orders">View Orders</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

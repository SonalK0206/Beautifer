<!DOCTYPE html>
<html>
<head>
    <title>Beautifer</title>
    <link rel="icon" type="image/jpeg" href="/images/beautifer-logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #c8dede;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 1.5s ease forwards;
        }

        .brand-name {
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            color: #2a7a7a;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .heel-icon {
            display: inline-block;
            font-size: 2.5rem;
            margin-left: 8px;
            vertical-align: middle;
            transform: translateY(-10px);
        }

        .loading-dots {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #2a7a7a;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div>
            <span class="brand-name">Beautifer</span>
            <span class="heel-icon">👠</span>
        </div>
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = '/login';
        }, 3000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile - Beautifer</title>
    <link rel="icon" type="image/jpeg" href="/images/beautifer-logo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { background: #0f1923; font-family: 'Poppins', sans-serif; color: #fff; }
        .navbar { background: linear-gradient(90deg, #0f2027, #203a43) !important; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .navbar-brand img { width: 100px; border-radius: 8px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; }
        .card-body { padding: 2.5rem; }
        .form-control { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 10px; padding: 12px; }
        .form-control:focus { background: rgba(255,255,255,0.12); border-color: #17a2b8; box-shadow: 0 0 0 3px rgba(23,162,184,0.2); color: #fff; }
        .form-control:disabled { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.3); }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .form-label { color: #a0d8d8; font-size: 0.8rem; letter-spacing: 1px; }
        .btn-update { background: linear-gradient(90deg, #17a2b8, #0d6efd); border: none; border-radius: 10px; padding: 12px; font-weight: 600; color: #fff; }
        .btn-update:hover { opacity: 0.9; color: #fff; }
        .nav-btn { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.8); font-size: 0.85rem; border-radius: 20px; padding: 6px 14px; }
        .section-title { color: #fff; font-weight: 600; }
        .avatar { width: 70px; height: 70px; background: linear-gradient(135deg, #17a2b8, #0d6efd); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/products">
            <div class="text-center mb-3">
                <span style="font-family: 'Great Vibes', cursive; font-size: 3rem; color: #17a2b8;">Beautifer</span>
                <span style="font-size: 1.5rem;">👠</span>
            </div>
        </a>
        <div class="ms-auto d-flex gap-2">
            <a href="/products" class="btn btn-outline-light nav-btn">← Shop</a>
            <a href="/logout" class="btn btn-danger btn-sm rounded-pill px-3">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="avatar">👤</div>
                        <h5 class="section-title">Your Profile</h5>
                    </div>

                    <div th:if="${success}" class="alert border-0 rounded-3" style="background:rgba(23,162,184,0.15); color:#17a2b8;" th:text="${success}"></div>
                    <div th:if="${error}" class="alert alert-danger border-0 rounded-3" th:text="${error}"></div>

                    <form action="/profile/update" method="post" th:object="${user}">
                        <input type="hidden" name="id" th:value="${user.id}">
                        <input type="hidden" name="email" th:value="${user.email}">

                        <div class="mb-3">
                            <label class="form-label">EMAIL</label>
                            <input type="email" class="form-control" th:value="${user.email}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">FULL NAME</label>
                            <input type="text" name="name" class="form-control" th:value="${user.name}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">MOBILE NUMBER</label>
                            <input type="text" name="mobile" class="form-control" th:value="${user.mobile}" pattern="[0-9]{10}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ADDRESS</label>
                            <textarea name="address" class="form-control" rows="3" required th:text="${user.address}"></textarea>
                        </div>
                        <button type="submit" class="btn-update w-100">Update Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orders - Beautifer</title>
    <link rel="icon" type="image/jpeg" href="/images/beautifer-logo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { background: #0f1923; font-family: 'Poppins', sans-serif; color: #fff; }
        .navbar { background: linear-gradient(90deg, #0f2027, #203a43) !important; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .navbar-brand img { width: 100px; border-radius: 8px; }
        .order-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 1.2rem 1.5rem; margin-bottom: 1rem; transition: border-color 0.2s; }
        .order-card:hover { border-color: rgba(23,162,184,0.3); }
        .order-id { color: #17a2b8; font-weight: 600; }
        .order-amount { font-size: 1.2rem; font-weight: 700; }
        .status-badge { background: rgba(23,162,184,0.15); border: 1px solid #17a2b8; color: #17a2b8; border-radius: 20px; padding: 3px 12px; font-size: 0.8rem; }
        .order-date { color: rgba(255,255,255,0.4); font-size: 0.8rem; }
        .empty { text-align: center; padding: 80px 0; color: rgba(255,255,255,0.4); }
        .nav-btn { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.8); font-size: 0.85rem; border-radius: 20px; padding: 6px 14px; }
        .section-title { color: #fff; font-weight: 600; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/products">
            <div class="text-center mb-3">
                <span style="font-family: 'Great Vibes', cursive; font-size: 3rem; color: #17a2b8;">Beautifer</span>
                <span style="font-size: 1.5rem;">👠</span>
            </div>
        </a>
        <div class="ms-auto d-flex gap-2">
            <a href="/products" class="btn btn-outline-light nav-btn">← Shop</a>
            <a href="/logout" class="btn btn-danger btn-sm rounded-pill px-3">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h5 class="section-title mb-4">📦 Your Orders</h5>

    <div th:if="${#lists.isEmpty(orders)}" class="empty">
        <h3>📦</h3>
        <h5>No orders yet</h5>
        <a href="/products" class="btn btn-outline-info mt-2">Start Shopping</a>
    </div>

    <div th:each="order : ${orders}" class="order-card">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <p class="order-id mb-1">Order #<span th:text="${order.id}"></span></p>
                <p class="order-amount mb-1">₹<span th:text="${order.totalAmount}"></span></p>
                <p class="order-date mb-0" th:text="${order.orderedAt}"></p>
            </div>
            <span class="status-badge" th:text="${order.status}"></span>
        </div>
    </div>
</div>
</body>
</html>

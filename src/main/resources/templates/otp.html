<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verify OTP - Beautifer</title>
    <link rel="icon" type="image/jpeg" href="/images/beautifer-logo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; display: flex; align-items: center; font-family: 'Poppins', sans-serif; }
        .card { border: none; border-radius: 20px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .card-body { padding: 2.5rem; }
        .logo-img { width: 140px; border-radius: 10px; }
        .form-control { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 10px; padding: 12px; font-size: 1.8rem; letter-spacing: 0.8rem; text-align: center; }
        .form-control:focus { background: rgba(255,255,255,0.12); border-color: #17a2b8; box-shadow: 0 0 0 3px rgba(23,162,184,0.2); color: #fff; }
        .form-control::placeholder { color: rgba(255,255,255,0.3); font-size: 1rem; letter-spacing: 0.3rem; }
        .form-label { color: #a0d8d8; font-size: 0.85rem; letter-spacing: 1px; }
        .btn-brand { background: linear-gradient(90deg, #17a2b8, #0d6efd); border: none; border-radius: 10px; padding: 12px; font-weight: 600; }
        .btn-brand:hover { opacity: 0.9; }
        a { color: #17a2b8; }
        .subtitle { color: rgba(255,255,255,0.5); font-size: 0.9rem; }
        .page-title { color: #fff; font-weight: 600; }
        .divider { border-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="text-center mb-3">
                            <span style="font-family: 'Great Vibes', cursive; font-size: 3rem; color: #17a2b8;">Beautifer</span>
                            <span style="font-size: 1.5rem;">👠</span>
                        </div>
                        <h5 class="page-title">Verify Your Email</h5>
                        <p class="subtitle">We sent a 6-digit OTP to your email</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger border-0 rounded-3" th:text="${error}"></div>

                    <form action="/otp" method="post">
                        <div class="mb-4">
                            <label class="form-label">ENTER OTP</label>
                            <input type="text" name="otp" class="form-control"
                                   placeholder="······" maxlength="6" pattern="[0-9]{6}" required>
                        </div>
                        <button type="submit" class="btn btn-brand btn-primary w-100">Verify OTP →</button>
                    </form>

                    <hr class="divider my-4">
                    <p class="text-center subtitle mb-0">
                        <a href="/login">← Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
